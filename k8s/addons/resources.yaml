apiVersion: v1
kind: Namespace
metadata:
  name: kubecost
---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ca2-addons
spec:
  role: ca2-resilience-karpenter-node
  amiSelectorTerms:
    - alias: al2023@v20261031
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ca2-resilience
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ca2-resilience
  associatePublicIPAddress: true
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: lab-addons
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ca2-addons
      expireAfter: Never
      taints:
        - key: ca2-workload
          value: addons
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-1a, us-east-1b]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m5.xlarge]
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
  limits:
    cpu: "4"
