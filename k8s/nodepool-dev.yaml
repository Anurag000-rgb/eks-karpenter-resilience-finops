apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: dev-spot
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ca2-dev
      expireAfter: Never
      taints:
        - key: ca2-workload
          value: dev
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-1a]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m5.large]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  limits:
    cpu: "6"
