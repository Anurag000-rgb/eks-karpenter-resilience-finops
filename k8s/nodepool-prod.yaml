apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: prod-on-demand
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ca2-prod
      expireAfter: Never
      taints:
        - key: ca2-workload
          value: prod
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-1a, us-east-1b]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m5.large]
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
  limits:
    cpu: "6"
